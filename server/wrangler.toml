name = "word-arena"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[vars]
# GitHub Pages origin of the frontend, e.g. "https://6880050027.github.io". "*" allows any (dev only).
ALLOWED_ORIGIN = "https://leaomila1.github.io"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[rules]]
type = "Data"
globs = ["**/*.bin"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true
